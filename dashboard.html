<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard | Carezza Rifa</title>

  <script src="https://cdn.tailwindcss.com/3.4.17"></script>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Nunito:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --brand-primary: #b5a7cb;
      --brand-secondary: #f8dcc0;
      --brand-accent: #8a7aa6;
      --brand-light: #e8e2f0;
      --brand-bg: linear-gradient(135deg, #fdf0e4 0%, #ffffff 40%, #e8e2f0 100%);
    }

    body {
      font-family: 'Nunito', sans-serif;
      background: var(--brand-bg);
    }

    .font-heading {
      font-family: 'Cormorant Garamond', serif;
    }

    .brand-bg {
      background: var(--brand-bg);
    }

    .brand-primary-bg {
      background-color: var(--brand-primary) !important;
    }

    .brand-primary-text {
      color: var(--brand-primary) !important;
    }

    .brand-accent-text {
      color: var(--brand-accent) !important;
    }

    .brand-secondary-bg {
      background-color: var(--brand-secondary) !important;
    }

    .brand-border {
      border-color: var(--brand-light) !important;
    }
  </style>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            lavender: '#b5a7cb',
            peach: '#f8dcc0',
            lavLight: '#e8e2f0',
            peachLight: '#fdf0e4',
            lavDark: '#8a7aa6'
          }
        }
      }
    };
  </script>
</head>

<body class="min-h-screen bg-white brand-bg">
  <main class="min-h-screen p-4 sm:p-6">
    <div class="max-w-6xl mx-auto">

      <!-- Header -->
      <section class="bg-white/90 backdrop-blur rounded-3xl shadow-lg border border-lavLight p-6 sm:p-8 mb-6">
        <div class="text-center">
          <h1 id="pageTitle" class="font-heading text-4xl text-lavDark font-bold">Mis Rifas</h1>
          <p id="pageSubtitle" class="text-sm text-lavDark/60 mt-2">Crea, administra y comparte tus rifas</p>

          <div id="schoolInfoBox" class="hidden mt-5 rounded-2xl bg-peachLight px-4 py-3 text-sm text-lavDark/80">
            <p id="schoolInfoName" class="font-heading text-2xl font-bold text-lavDark"></p>

            <div class="mt-2 flex flex-wrap items-center justify-center gap-3 text-xs">
              <a id="schoolInfoWebsite" href="#" target="_blank" class="hidden underline hover:opacity-80"></a>
              <a id="schoolInfoEmail" href="#" class="hidden underline hover:opacity-80"></a>
              <span id="schoolInfoPhone" class="hidden"></span>
            </div>
          </div>

          <div id="userBox" class="mt-4 inline-flex items-center gap-2 rounded-full bg-peachLight px-4 py-2 text-sm text-lavDark hidden"></div>
        </div>

        <div id="createSection" class="grid grid-cols-1 md:grid-cols-[1fr_auto] gap-3 mt-6">
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
            <input
              id="raffleNameInput"
              class="w-full px-4 py-3 rounded-2xl border border-lavLight focus:outline-none focus:ring-2 focus:ring-lavender/40"
              placeholder="Ej: Rifa Día de la Madre"
            />

            <input
              id="raffleSlugInput"
              class="w-full px-4 py-3 rounded-2xl border border-lavLight focus:outline-none focus:ring-2 focus:ring-lavender/40"
              placeholder="Slug opcional: rifa-dia-madre"
            />

            <input
              id="raffleStartInput"
              type="number"
              min="0"
              value="1"
              class="w-full px-4 py-3 rounded-2xl border border-lavLight focus:outline-none focus:ring-2 focus:ring-lavender/40"
              placeholder="Desde: 0"
            />

            <input
              id="raffleEndInput"
              type="number"
              min="0"
              value="100"
              class="w-full px-4 py-3 rounded-2xl border border-lavLight focus:outline-none focus:ring-2 focus:ring-lavender/40"
              placeholder="Hasta: 100"
            />
          </div>

          <div id="ownerSelectContainer" class="hidden">
            <select
              id="raffleOwnerSelect"
              class="w-full px-4 py-3 rounded-2xl border border-lavLight focus:outline-none focus:ring-2 focus:ring-lavender/40"
            >
              <option value="">Seleccionar usuario...</option>
            </select>
          </div>

          <button
            id="createRaffleBtn"
            class="h-12 px-5 rounded-2xl bg-lavender text-white font-semibold hover:bg-lavDark transition"
          >
            Crear rifa
          </button>
        </div>

        <div class="flex flex-wrap gap-3 mt-4">
          <a
  href="sorteo.html"
  class="h-11 px-4 rounded-2xl bg-lavender text-white font-semibold hover:bg-lavDark transition flex items-center justify-center"
>
  Ir a sorteo
</a>
          <button
            id="logoutBtn"
            class="h-11 px-4 rounded-2xl bg-white text-red-500 border border-red-200 font-semibold hover:bg-red-50 transition"
          >
            Cerrar sesión
          </button>
        </div>

        <div id="statusBox" class="mt-4 text-sm rounded-2xl px-4 py-3 bg-peachLight text-lavDark/80 hidden"></div>
      </section>

      <!-- Rifas -->
      <section class="bg-white/90 backdrop-blur rounded-3xl shadow-lg border border-lavLight p-6 sm:p-8">
        <div class="flex items-center justify-between gap-3 mb-4">
          <h2 id="listTitle" class="font-heading text-3xl text-lavDark font-bold">Tus rifas</h2>
          <span id="countBox" class="text-sm text-lavDark/60">0 rifas</span>
        </div>

        <div id="rafflesList" class="grid grid-cols-1 gap-4">
          <p class="text-lavDark/50">Aún no hay rifas para mostrar.</p>
        </div>
      </section>

      <!-- Usuarios -->
      <section id="usersSection" class="hidden bg-white/90 backdrop-blur rounded-3xl shadow-lg border border-lavLight p-6 sm:p-8 mt-6">
        <div class="flex items-center justify-between gap-3 mb-4">
          <h2 class="font-heading text-3xl text-lavDark font-bold">Usuarios del sistema</h2>
          <span id="usersCountBox" class="text-sm text-lavDark/60">0 usuarios</span>
        </div>

        <div id="usersList" class="grid grid-cols-1 gap-4">
          <p class="text-lavDark/50">No hay usuarios para mostrar.</p>
        </div>
      </section>

      <!-- Branding -->
      <section id="brandingSection" class="hidden bg-white/90 backdrop-blur rounded-3xl shadow-lg border border-lavLight p-6 sm:p-8 mt-6">
        <h2 class="font-heading text-3xl text-lavDark font-bold mb-6">🎨 Personalización de Marca</h2>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

          <!-- Formulario -->
          <div class="space-y-4">

            <!-- Datos del Establecimiento -->
            <div class="rounded-2xl bg-lavLight/20 p-4">
              <label class="text-sm font-semibold text-lavDark/80 uppercase tracking-wide block mb-3">
                📍 Datos del Establecimiento
              </label>

              <div class="space-y-3">
                <div>
                  <label class="text-xs font-semibold text-lavDark/60 uppercase tracking-wide block mb-2">
                    Nombre del Colegio
                  </label>
                  <input
                    id="schoolName"
                    type="text"
                    placeholder="Ej: Colegio San José"
                    class="w-full px-3 py-2 rounded-xl border border-lavLight text-sm focus:outline-none focus:ring-2 focus:ring-lavender/40"
                  />
                </div>

                <div>
                  <label class="text-xs font-semibold text-lavDark/60 uppercase tracking-wide block mb-2">
                    Página Web
                  </label>
                  <input
                    id="schoolWebsite"
                    type="url"
                    placeholder="https://www.ejemplo.com"
                    class="w-full px-3 py-2 rounded-xl border border-lavLight text-sm focus:outline-none focus:ring-2 focus:ring-lavender/40"
                  />
                </div>

                <div>
                  <label class="text-xs font-semibold text-lavDark/60 uppercase tracking-wide block mb-2">
                    Correo Electrónico
                  </label>
                  <input
                    id="schoolEmail"
                    type="email"
                    placeholder="contacto@colegio.com"
                    class="w-full px-3 py-2 rounded-xl border border-lavLight text-sm focus:outline-none focus:ring-2 focus:ring-lavender/40"
                  />
                </div>

                <div>
                  <label class="text-xs font-semibold text-lavDark/60 uppercase tracking-wide block mb-2">
                    Teléfono
                  </label>
                  <input
                    id="schoolPhone"
                    type="tel"
                    placeholder="+56 9 1234 5678"
                    class="w-full px-3 py-2 rounded-xl border border-lavLight text-sm focus:outline-none focus:ring-2 focus:ring-lavender/40"
                  />
                </div>
              </div>
            </div>

            <!-- Colores -->
            <div class="rounded-2xl bg-lavLight/20 p-4">
              <label class="text-sm font-semibold text-lavDark/80 uppercase tracking-wide block mb-3">
                🎨 Colores Personalizados
              </label>

              <div class="space-y-3">
                <div>
                  <label class="text-xs font-semibold text-lavDark/60 uppercase tracking-wide block mb-2">
                    Color Primario
                  </label>
                  <div class="flex gap-2 items-center">
                    <input
                      id="colorPrimary"
                      type="color"
                      value="#b5a7cb"
                      class="w-12 h-10 rounded-lg border border-lavLight cursor-pointer"
                    />
                    <input
                      id="colorPrimaryText"
                      type="text"
                      value="#b5a7cb"
                      class="flex-1 px-3 py-2 rounded-xl border border-lavLight text-sm focus:outline-none focus:ring-2 focus:ring-lavender/40"
                    />
                  </div>
                </div>

                <div>
                  <label class="text-xs font-semibold text-lavDark/60 uppercase tracking-wide block mb-2">
                    Color Secundario
                  </label>
                  <div class="flex gap-2 items-center">
                    <input
                      id="colorSecondary"
                      type="color"
                      value="#f8dcc0"
                      class="w-12 h-10 rounded-lg border border-lavLight cursor-pointer"
                    />
                    <input
                      id="colorSecondaryText"
                      type="text"
                      value="#f8dcc0"
                      class="flex-1 px-3 py-2 rounded-xl border border-lavLight text-sm focus:outline-none focus:ring-2 focus:ring-lavender/40"
                    />
                  </div>
                </div>

                <div>
                  <label class="text-xs font-semibold text-lavDark/60 uppercase tracking-wide block mb-2">
                    Color Acentuado
                  </label>
                  <div class="flex gap-2 items-center">
                    <input
                      id="colorAccent"
                      type="color"
                      value="#8a7aa6"
                      class="w-12 h-10 rounded-lg border border-lavLight cursor-pointer"
                    />
                    <input
                      id="colorAccentText"
                      type="text"
                      value="#8a7aa6"
                      class="flex-1 px-3 py-2 rounded-xl border border-lavLight text-sm focus:outline-none focus:ring-2 focus:ring-lavender/40"
                    />
                  </div>
                </div>
              </div>
            </div>

            <!-- Botones -->
            <div class="flex flex-col sm:flex-row gap-3">
              <button
                onclick="saveBranding()"
                class="flex-1 px-4 py-3 rounded-2xl bg-lavender text-white font-semibold hover:bg-lavDark transition"
              >
                💾 Guardar Cambios
              </button>

              <button
                onclick="resetBranding()"
                class="flex-1 px-4 py-3 rounded-2xl bg-white text-lavDark border border-lavLight font-semibold hover:bg-lavLight/30 transition"
              >
                ↺ Restaurar
              </button>
            </div>
          </div>

          <!-- Vista Previa -->
          <div class="rounded-2xl bg-lavLight/10 p-6 flex flex-col">
            <h3 class="text-sm font-semibold text-lavDark/70 uppercase mb-4">Vista Previa</h3>

            <div
              id="brandingPreview"
              class="flex-1 rounded-2xl p-6 text-center flex flex-col items-center justify-center gap-4"
              style="background: linear-gradient(135deg, #fdf0e4 0%, #ffffff 40%, #e8e2f0 100%)"
            >
              <div>
                <p id="previewSchoolName" class="font-heading text-xl font-bold text-lavDark">Mi Colegio</p>
                <div id="previewSchoolInfo" class="text-xs text-lavDark/60 mt-2 space-y-1"></div>
              </div>

              <h2 class="font-heading text-2xl font-bold" style="color: #b5a7cb">Carezza Rifa</h2>

              <div class="flex gap-2 mt-4">
                <div class="preview-color-1 w-8 h-8 rounded-full" style="background-color: #b5a7cb"></div>
                <div class="preview-color-2 w-8 h-8 rounded-full" style="background-color: #f8dcc0"></div>
                <div class="preview-color-3 w-8 h-8 rounded-full" style="background-color: #8a7aa6"></div>
              </div>

              <p class="text-xs text-lavDark/50 mt-2">Los cambios se ven aquí en tiempo real</p>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script src="firebase-config.js"></script>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js';

    import {
      getAuth,
      onAuthStateChanged,
      signOut
    } from 'https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js';

    import {
      getFirestore,
      collection,
      doc,
      setDoc,
      onSnapshot,
      serverTimestamp,
      getDoc,
      getDocs,
      deleteDoc,
      writeBatch
    } from 'https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js';

    const defaultConfig = {
      raffle_name: 'Gran Rifa',
      prize: 'Una canasta sorpresa',
      price: '2000',
      whatsapp: '56933024232',
      reserve_message: 'Hola, quiero reservar un número de la rifa y realizar el pago.',
      payment_message: 'Para confirmar tu número, realiza el pago y envía el comprobante. Transferencia a: [TUS DATOS AQUÍ]',
      number_start: '1',
      number_end: '100',
      total_numbers: '100',
      raffle_status: 'active'
    };

    const DEFAULT_BRANDING = {
      school_name: '',
      school_website: '',
      school_email: '',
      school_phone: '',
      primary_color: '#b5a7cb',
      secondary_color: '#f8dcc0',
      accent_color: '#8a7aa6'
    };

    let app, auth, db;
    let currentUser = null;
    let currentProfile = null;
    let unsubscribeOwnRaffles = null;
    let unsubscribeBranding = null;
    let allUsersCache = [];

    function showStatus(message, isError = false) {
      const box = document.getElementById('statusBox');
      if (!box) return;

      box.textContent = message;
      box.classList.remove('hidden');
      box.className = 'mt-4 text-sm rounded-2xl px-4 py-3 ' + (
        isError ? 'bg-red-50 text-red-600' : 'bg-peachLight text-lavDark/80'
      );
    }

    function clearStatus() {
      const box = document.getElementById('statusBox');
      if (!box) return;

      box.classList.add('hidden');
      box.textContent = '';
    }

    function slugify(text) {
      return String(text || '')
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '')
        .replace(/-{2,}/g, '-')
        .slice(0, 50);
    }

    function generateShareId() {
      return 'share-' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
    }

    function isSuperAdmin() {
      return currentProfile?.role === 'superadmin';
    }

    function userProfileRef(userId) {
      return doc(db, 'users', userId);
    }

    function rafflesColRef(userId = currentUser.uid) {
      return collection(db, 'users', userId, 'raffles');
    }

    function raffleDocRef(raffleId, userId = currentUser.uid) {
      return doc(db, 'users', userId, 'raffles', raffleId);
    }

    function raffleConfigRef(raffleId, userId = currentUser.uid) {
      return doc(db, 'users', userId, 'raffles', raffleId, 'meta', 'config');
    }

    function raffleTicketsColRef(raffleId, userId = currentUser.uid) {
      return collection(db, 'users', userId, 'raffles', raffleId, 'tickets');
    }

    function publicRaffleRef(shareId) {
      return doc(db, 'public_raffles', shareId);
    }

    function brandingRef() {
      return doc(db, 'school-branding', 'default');
    }

    function hexToRgba(hex, alpha = 1) {
      const cleanHex = String(hex || '').replace('#', '');

      if (!/^[0-9A-Fa-f]{6}$/.test(cleanHex)) {
        return `rgba(181, 167, 203, ${alpha})`;
      }

      const r = parseInt(cleanHex.slice(0, 2), 16);
      const g = parseInt(cleanHex.slice(2, 4), 16);
      const b = parseInt(cleanHex.slice(4, 6), 16);

      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function normalizeWebsiteUrl(url) {
      const cleanUrl = String(url || '').trim();
      if (!cleanUrl) return '';
      return cleanUrl.startsWith('http://') || cleanUrl.startsWith('https://')
        ? cleanUrl
        : `https://${cleanUrl}`;
    }

    function applyBranding(branding = {}) {
      const data = {
        ...DEFAULT_BRANDING,
        ...branding
      };

      const root = document.documentElement;

      root.style.setProperty('--brand-primary', data.primary_color);
      root.style.setProperty('--brand-secondary', data.secondary_color);
      root.style.setProperty('--brand-accent', data.accent_color);
      root.style.setProperty('--brand-light', hexToRgba(data.primary_color, 0.25));
      root.style.setProperty(
        '--brand-bg',
        `linear-gradient(135deg, ${hexToRgba(data.secondary_color, 0.45)} 0%, #ffffff 40%, ${hexToRgba(data.primary_color, 0.35)} 100%)`
      );

      document.body.style.background =
        `linear-gradient(135deg, ${hexToRgba(data.secondary_color, 0.45)} 0%, #ffffff 40%, ${hexToRgba(data.primary_color, 0.35)} 100%)`;

      document.querySelectorAll('.bg-lavender').forEach((el) => {
        el.style.backgroundColor = data.primary_color;
      });

      document.querySelectorAll('.text-lavDark').forEach((el) => {
        el.style.color = data.accent_color;
      });

      document.querySelectorAll('.border-lavLight').forEach((el) => {
        el.style.borderColor = hexToRgba(data.primary_color, 0.35);
      });

      document.querySelectorAll('.bg-peachLight').forEach((el) => {
        el.style.backgroundColor = hexToRgba(data.secondary_color, 0.45);
      });

      applySchoolInfo(data);
    }

    function applySchoolInfo(branding = {}) {
      const name = branding.school_name || '';
      const website = branding.school_website || '';
      const email = branding.school_email || '';
      const phone = branding.school_phone || '';

      const box = document.getElementById('schoolInfoBox');
      const nameEl = document.getElementById('schoolInfoName');
      const websiteEl = document.getElementById('schoolInfoWebsite');
      const emailEl = document.getElementById('schoolInfoEmail');
      const phoneEl = document.getElementById('schoolInfoPhone');

      const hasData = Boolean(name || website || email || phone);

      if (box) {
        box.classList.toggle('hidden', !hasData);
      }

      if (nameEl) {
        nameEl.textContent = name;
      }

      if (websiteEl) {
        if (website) {
          websiteEl.href = normalizeWebsiteUrl(website);
          websiteEl.textContent = website;
          websiteEl.classList.remove('hidden');
        } else {
          websiteEl.classList.add('hidden');
        }
      }

      if (emailEl) {
        if (email) {
          emailEl.href = `mailto:${email}`;
          emailEl.textContent = email;
          emailEl.classList.remove('hidden');
        } else {
          emailEl.classList.add('hidden');
        }
      }

      if (phoneEl) {
        if (phone) {
          phoneEl.textContent = phone;
          phoneEl.classList.remove('hidden');
        } else {
          phoneEl.classList.add('hidden');
        }
      }
    }

    function listenBranding() {
      if (unsubscribeBranding) unsubscribeBranding();

      unsubscribeBranding = onSnapshot(brandingRef(), (snap) => {
        const data = snap.exists() ? snap.data() : DEFAULT_BRANDING;

        applyBranding(data);

        if (isSuperAdmin()) {
          loadBrandingToForm(data);
        }
      }, (error) => {
        console.error('Error cargando branding:', error);
        applyBranding(DEFAULT_BRANDING);
      });
    }

    function loadBrandingToForm(data = {}) {
      const branding = {
        ...DEFAULT_BRANDING,
        ...data
      };

      const schoolName = document.getElementById('schoolName');
      const schoolWebsite = document.getElementById('schoolWebsite');
      const schoolEmail = document.getElementById('schoolEmail');
      const schoolPhone = document.getElementById('schoolPhone');

      const colorPrimary = document.getElementById('colorPrimary');
      const colorPrimaryText = document.getElementById('colorPrimaryText');
      const colorSecondary = document.getElementById('colorSecondary');
      const colorSecondaryText = document.getElementById('colorSecondaryText');
      const colorAccent = document.getElementById('colorAccent');
      const colorAccentText = document.getElementById('colorAccentText');

      if (schoolName) schoolName.value = branding.school_name || '';
      if (schoolWebsite) schoolWebsite.value = branding.school_website || '';
      if (schoolEmail) schoolEmail.value = branding.school_email || '';
      if (schoolPhone) schoolPhone.value = branding.school_phone || '';

      if (colorPrimary) colorPrimary.value = branding.primary_color || DEFAULT_BRANDING.primary_color;
      if (colorPrimaryText) colorPrimaryText.value = branding.primary_color || DEFAULT_BRANDING.primary_color;

      if (colorSecondary) colorSecondary.value = branding.secondary_color || DEFAULT_BRANDING.secondary_color;
      if (colorSecondaryText) colorSecondaryText.value = branding.secondary_color || DEFAULT_BRANDING.secondary_color;

      if (colorAccent) colorAccent.value = branding.accent_color || DEFAULT_BRANDING.accent_color;
      if (colorAccentText) colorAccentText.value = branding.accent_color || DEFAULT_BRANDING.accent_color;

      updateBrandingPreview();
    }

    function updateBrandingPreview() {
      const schoolName = document.getElementById('schoolName')?.value || 'Mi Colegio';
      const schoolWebsite = document.getElementById('schoolWebsite')?.value || '';
      const schoolEmail = document.getElementById('schoolEmail')?.value || '';
      const schoolPhone = document.getElementById('schoolPhone')?.value || '';

      const primary = document.getElementById('colorPrimary')?.value || DEFAULT_BRANDING.primary_color;
      const secondary = document.getElementById('colorSecondary')?.value || DEFAULT_BRANDING.secondary_color;
      const accent = document.getElementById('colorAccent')?.value || DEFAULT_BRANDING.accent_color;

      const previewSchoolName = document.getElementById('previewSchoolName');
      const infoDiv = document.getElementById('previewSchoolInfo');
      const preview = document.getElementById('brandingPreview');

      if (previewSchoolName) {
        previewSchoolName.textContent = schoolName;
        previewSchoolName.style.color = accent;
      }

      if (infoDiv) {
        infoDiv.innerHTML = '';
        if (schoolWebsite) infoDiv.innerHTML += `<div>🌐 ${schoolWebsite}</div>`;
        if (schoolEmail) infoDiv.innerHTML += `<div>📧 ${schoolEmail}</div>`;
        if (schoolPhone) infoDiv.innerHTML += `<div>📱 ${schoolPhone}</div>`;
      }

      if (preview) {
        preview.style.background = `linear-gradient(135deg, ${secondary}80 0%, #ffffff 40%, ${primary}60 100%)`;

        const colorDots = preview.querySelectorAll('.w-8');
        if (colorDots[0]) colorDots[0].style.backgroundColor = primary;
        if (colorDots[1]) colorDots[1].style.backgroundColor = secondary;
        if (colorDots[2]) colorDots[2].style.backgroundColor = accent;

        const title = preview.querySelector('h2');
        if (title) title.style.color = primary;
      }
    }

    async function saveBranding() {
      if (!isSuperAdmin()) {
        showStatus('No tienes permisos para editar la marca.', true);
        return;
      }

      try {
        const schoolName = document.getElementById('schoolName').value.trim();

    function normalizeRaffleRange(startValue, endValue) {
      const start = Math.max(0, Math.min(9999, parseInt(startValue, 10)));
      const end = Math.max(0, Math.min(9999, parseInt(endValue, 10)));

      if (!Number.isInteger(start) || !Number.isInteger(end)) {
        return null;
      }

      if (end < start) {
        return null;
      }

      return {
        start,
        end,
        count: end - start + 1
      };
    }

    async function createRaffle() {
      clearStatus();

      const nameInput = document.getElementById('raffleNameInput');
      const slugInput = document.getElementById('raffleSlugInput');
      const startInput = document.getElementById('raffleStartInput');
      const endInput = document.getElementById('raffleEndInput');
      const ownerSelect = document.getElementById('raffleOwnerSelect');

      const raffleName = nameInput.value.trim();
      let raffleId = slugify(slugInput.value.trim());
      const range = normalizeRaffleRange(startInput.value, endInput.value);

      if (!raffleName) {
        showStatus('Debes escribir un nombre para la rifa.', true);
        return;
      }

      if (!raffleId) raffleId = slugify(raffleName);

      if (!raffleId) {
        showStatus('No se pudo generar un identificador para la rifa.', true);
        return;
      }

      if (!range) {
        showStatus('Debes definir un rango válido. El número final debe ser mayor o igual al inicial.', true);
        return;
      }

      let targetUserId = currentUser.uid;

      if (isSuperAdmin()) {
        targetUserId = ownerSelect.value || currentUser.uid;
      }

      try {
        const shareId = generateShareId();

        await ensureRootRaffleDoc(raffleId, raffleName, shareId, range, targetUserId);

        try {
          await ensurePublicRaffleDoc(shareId, raffleId, raffleName, targetUserId);
        } catch (publicError) {
          console.warn('No se pudo crear el índice público de la rifa. El enlace cliente usará owner y raffle como respaldo.', publicError);
        }

        await ensureRaffleConfig(raffleId, raffleName, range, targetUserId);

        nameInput.value = '';
        slugInput.value = '';
        startInput.value = '1';
        endInput.value = '100';
        if (ownerSelect) ownerSelect.value = '';

        showStatus('Rifa creada correctamente.');
        await refreshDashboard();
      } catch (error) {
        console.error('Error creando rifa:', error);
        showStatus('Error al crear la rifa.', true);
      }
    }

    async function deleteRaffle(ownerUid, raffleId, raffleName, shareId) {
      const ok = window.confirm(
        `¿Seguro que quieres borrar la rifa "${raffleName}"? Esta acción eliminará tickets, configuración y la rifa del panel.`
      );

      if (!ok) return;

      try {
        const ticketsSnap = await getDocs(raffleTicketsColRef(raffleId, ownerUid));

        if (!ticketsSnap.empty) {
          const docs = ticketsSnap.docs;

          for (let i = 0; i < docs.length; i += 400) {
            const batch = writeBatch(db);
            docs.slice(i, i + 400).forEach((ticketDoc) => batch.delete(ticketDoc.ref));
            await batch.commit();
          }
        }

        await deleteDoc(raffleConfigRef(raffleId, ownerUid));
        await deleteDoc(raffleDocRef(raffleId, ownerUid));

        if (shareId) {
          await deleteDoc(publicRaffleRef(shareId));
        }

        showStatus(`Rifa "${raffleName}" eliminada correctamente.`);
        await refreshDashboard();
      } catch (error) {
        console.error('Error eliminando rifa:', error);
        showStatus('Error al eliminar la rifa.', true);
      }
    }

    async function fetchAllRafflesForSuperAdmin() {
      const usersSnap = await getDocs(collection(db, 'users'));
      const allRaffles = [];

      for (const userDoc of usersSnap.docs) {
        const userData = userDoc.data() || {};
        const rafflesSnap = await getDocs(collection(db, 'users', userDoc.id, 'raffles'));

        rafflesSnap.forEach((raffleDoc) => {
          allRaffles.push({
            id: raffleDoc.id,
            data: raffleDoc.data(),
            owner_uid: userDoc.id,
            owner_email: userData.email || '',
            owner_name: userData.display_name || ''
          });
        });
      }

      allRaffles.sort((a, b) => {
        const av = a.data.raffle_name || a.id;
        const bv = b.data.raffle_name || b.id;
        return av.localeCompare(bv, 'es');
      });

      renderRaffles(allRaffles);
    }

    async function loadAllUsers() {
      if (!isSuperAdmin()) return;

      try {
        const usersSnap = await getDocs(collection(db, 'users'));

        allUsersCache = usersSnap.docs.map((userDoc) => ({
          uid: userDoc.id,
          email: userDoc.data().email || '',
          display_name: userDoc.data().display_name || '',
          role: userDoc.data().role || 'admin',
          active: userDoc.data().active !== false
        }));

        allUsersCache.sort((a, b) => {
          const av = a.display_name || a.email || a.uid;
          const bv = b.display_name || b.email || b.uid;
          return av.localeCompare(bv, 'es');
        });

        updateOwnerSelect();
        renderUsersList();
      } catch (error) {
        console.error('Error cargando usuarios:', error);
        showStatus('Error cargando usuarios.', true);
      }

    function updateOwnerSelect() {
      const select = document.getElementById('raffleOwnerSelect');

      if (!select) return;

      select.innerHTML = '';

      const selfOption = document.createElement('option');
      selfOption.value = currentUser.uid;
      selfOption.textContent = `Mi cuenta (${currentProfile?.email || currentUser.email || currentUser.uid})`;

          option.textContent = `${user.display_name || user.email} (${user.email})`;

    async function updateUserRole(uid, newRole) {
      if (!isSuperAdmin()) {
        showStatus('No tienes permisos para cambiar roles.', true);
        return;
      }

      if (!uid || !newRole) {
        showStatus('Usuario o rol inválido.', true);
        return;
      }

      const allowedRoles = ['superadmin', 'admin', 'cliente'];

      if (!allowedRoles.includes(newRole)) {
        showStatus('Rol no permitido.', true);
        return;
      }

      if (uid === currentUser.uid && newRole !== 'superadmin') {
        showStatus('No puedes quitarte a ti misma el rol de superadmin.', true);
        return;
      }

      const ok = window.confirm(`¿Confirmas cambiar el rol de este usuario a "${newRole}"?`);

      if (!ok) return;

      try {
        await setDoc(userProfileRef(uid), {
          role: newRole,
          updatedAt: serverTimestamp()
        }, { merge: true });

        showStatus(`Rol actualizado correctamente a "${newRole}".`);
        await loadAllUsers();
      } catch (error) {
        console.error('Error actualizando rol:', error);
        showStatus('Error al actualizar el rol del usuario.', true);
      }
    }

      if (isSuperAdmin()) {
        if (pageTitle) pageTitle.textContent = 'Panel de Dirección';
        if (pageSubtitle) pageSubtitle.textContent = 'Visualiza, crea y administra rifas, usuarios y marca';
        if (listTitle) listTitle.textContent = 'Todas las rifas';
        if (ownerSelectContainer) ownerSelectContainer.classList.remove('hidden');
        if (usersSection) usersSection.classList.remove('hidden');
        if (brandingSection) brandingSection.classList.remove('hidden');
      } else {
        if (pageTitle) pageTitle.textContent = 'Mis Rifas';
        if (pageSubtitle) pageSubtitle.textContent = 'Crea, administra y comparte tus rifas';
        if (listTitle) listTitle.textContent = 'Tus rifas';
        if (ownerSelectContainer) ownerSelectContainer.classList.add('hidden');
        if (usersSection) usersSection.classList.add('hidden');
        if (brandingSection) brandingSection.classList.add('hidden');
      }
    }

    function setupBrandingEvents() {
      const pairs = [
        ['colorPrimary', 'colorPrimaryText'],
        ['colorSecondary', 'colorSecondaryText'],
        ['colorAccent', 'colorAccentText']
      ];

      pairs.forEach(([colorId, textId]) => {
        const colorInput = document.getElementById(colorId);
        const textInput = document.getElementById(textId);

        if (colorInput && textInput) {
          colorInput.addEventListener('change', (event) => {
            textInput.value = event.target.value;
            updateBrandingPreview();
          });

          textInput.addEventListener('change', (event) => {
            const value = event.target.value.trim();

            if (/^#[0-9A-Fa-f]{6}$/.test(value)) {
              colorInput.value = value;
              updateBrandingPreview();
            } else {
              showStatus('El color debe tener formato hexadecimal. Ejemplo: #b5a7cb', true);
              textInput.value = colorInput.value;
            }
          });
        }
      });

      ['schoolName', 'schoolWebsite', 'schoolEmail', 'schoolPhone'].forEach((id) => {
        const input = document.getElementById(id);
        if (input) input.addEventListener('input', updateBrandingPreview);
      });
    }

    async function loadCurrentProfile(user) {
      const profileSnap = await getDoc(userProfileRef(user.uid));

      if (!profileSnap.exists()) {
        showStatus('No se encontró el perfil del usuario en Firestore.', true);
        throw new Error('Perfil no encontrado');
      }

      const data = profileSnap.data() || {};

      if (data.active === false) {
        await signOut(auth);

        document.body.innerHTML = `
          <main class="min-h-screen flex items-center justify-center p-4">
            <div class="max-w-md w-full bg-white rounded-3xl border border-lavLight shadow-lg p-6 text-center">
              <h1 class="font-heading text-3xl text-lavDark font-bold mb-3">Acceso deshabilitado</h1>
              <p class="text-lavDark/70">Tu cuenta está desactivada. Contacta a la administradora.</p>
            </div>
          </main>
        `;

        throw new Error('Usuario inactivo');
      }

      currentProfile = {
        email: data.email || user.email || '',
        display_name: data.display_name || '',
        role: data.role || 'admin',
        active: data.active !== false
      };
    }

    async function init() {
      app = initializeApp(window.FIREBASE_CONFIG);
      auth = getAuth(app);
      db = getFirestore(app);

      setupBrandingEvents();

      const createRaffleBtn = document.getElementById('createRaffleBtn');
      const logoutBtn = document.getElementById('logoutBtn');

      if (createRaffleBtn) {
        createRaffleBtn.addEventListener('click', createRaffle);
      }

      if (logoutBtn) {
        logoutBtn.addEventListener('click', async () => {
          await signOut(auth);
          window.location.href = 'login.html';
        });
      }

      onAuthStateChanged(auth, async (user) => {
        try {
          if (!user) {
            window.location.href = 'login.html';
            return;
          }

          currentUser = user;

          await loadCurrentProfile(user);
          listenBranding();
          applyDashboardMode();

          const userBox = document.getElementById('userBox');

          if (userBox) {
            userBox.classList.remove('hidden');
            userBox.textContent = `${currentProfile.display_name || user.email} · ${currentProfile.role}`;
          }

          await refreshDashboard();
        } catch (error) {
          console.error('Error iniciando sesión en dashboard:', error);
          showStatus('Error cargando el panel.', true);
        }
      });
    }

    init().catch((error) => {
      console.error('Error iniciando app:', error);
      alert('Error iniciando app');
    });
  </script>
</body>
</html>
