<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard | Carezza Rifa</title>

<script src="https://cdn.tailwindcss.com"></script>

<script src="firebase-config.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";
import { getFirestore, collection, doc, setDoc, getDocs, getDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const app = initializeApp(window.FIREBASE_CONFIG);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
let currentProfile = null;

const $ = id => document.getElementById(id);

function show(msg){ $("status").innerText = msg }

function slug(text){
  return text.toLowerCase().replace(/[^a-z0-9]/g,"-")
}

function isSuper(){ return currentProfile?.role === "superadmin" }

/* ---------------- CREAR RIFA ---------------- */

async function createRaffle(){
  const name = $("name").value.trim()
  if(!name) return show("Escribe un nombre")

  const id = slug(name)
  const share = "share-"+Math.random().toString(36).slice(2)

  await setDoc(doc(db,"users",currentUser.uid,"raffles",id),{
    raffle_name:name,
    public_share_id:share,
    createdAt:serverTimestamp()
  })

  await setDoc(doc(db,"public_raffles",share),{
    raffle_id:id,
    owner_uid:currentUser.uid
  })

  show("Rifa creada")
  loadDashboard()
}

/* ---------------- BORRAR ---------------- */

async function deleteRaffle(owner,id,share){
  if(!confirm("Eliminar rifa?")) return

  await deleteDoc(doc(db,"users",owner,"raffles",id))
  await deleteDoc(doc(db,"public_raffles",share))

  loadDashboard()
}

/* ---------------- USUARIOS ---------------- */

async function loadUsers(){
  if(!isSuper()) return

  const snap = await getDocs(collection(db,"users"))
  $("users").innerHTML=""

  snap.forEach(u=>{
    const d=u.data()

    const div=document.createElement("div")
    div.innerHTML=`
      <b>${d.email}</b> (${d.role})
      <button onclick="setRole('${u.id}','admin')">admin</button>
      <button onclick="setRole('${u.id}','superadmin')">super</button>
    `
    $("users").appendChild(div)
  })
}

window.setRole = async (uid,role)=>{
  await setDoc(doc(db,"users",uid),{role},{merge:true})
  loadUsers()
}

/* ---------------- RIFAS ---------------- */

async function loadRaffles(){
  $("list").innerHTML=""

  if(isSuper()){
    const users = await getDocs(collection(db,"users"))

    for(const u of users.docs){
      const raffles = await getDocs(collection(db,"users",u.id,"raffles"))

      raffles.forEach(r=>{
        renderRaffle(r.id,r.data(),u.id)
      })
    }
  }else{
    const raffles = await getDocs(collection(db,"users",currentUser.uid,"raffles"))
    raffles.forEach(r=>{
      renderRaffle(r.id,r.data(),currentUser.uid)
    })
  }
}

function renderRaffle(id,data,owner){
  const div=document.createElement("div")

  div.innerHTML=`
    <b>${data.raffle_name}</b>
    <a href="admin.html?raffle=${id}${isSuper() ? "&owner="+owner : ""}">Admin</a>
    <a href="cliente.html?share=${data.public_share_id}" target="_blank">Cliente</a>
    <button onclick="del('${owner}','${id}','${data.public_share_id}')">Borrar</button>
  `

  $("list").appendChild(div)
}

window.del = deleteRaffle

/* ---------------- DASHBOARD ---------------- */

async function loadProfile(user){
  const snap = await getDoc(doc(db,"users",user.uid))
  currentProfile = snap.data()
}

async function loadDashboard(){
  await loadRaffles()
  await loadUsers()
}

onAuthStateChanged(auth, async user=>{
  if(!user) return location="login.html"

  currentUser = user
  await loadProfile(user)

  loadDashboard()
})

window.logout = async ()=>{
  await signOut(auth)
  location="login.html"
}

window.create = createRaffle
</script>
</head>

<body style="font-family:sans-serif;padding:20px">

<h1>Dashboard</h1>

<input id="name" placeholder="Nombre rifa">
<button onclick="create()">Crear</button>
<button onclick="logout()">Salir</button>

<p id="status"></p>

<h2>Rifas</h2>
<div id="list"></div>

<h2>Usuarios (solo superadmin)</h2>
<div id="users"></div>

</body>
</html>
