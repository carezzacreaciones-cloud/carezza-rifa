<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard | Carezza Rifa</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Nunito:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
  :root {
    --brand-primary: #b5a7cb;
    --brand-secondary: #f8dcc0;
    --brand-accent: #8a7aa6;
    --brand-light: #e8e2f0;
    --brand-bg: linear-gradient(135deg, #fdf0e4 0%, #ffffff 40%, #e8e2f0 100%);

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--brand-bg);
  }

  .font-heading {
    font-family: 'Cormorant Garamond', serif;
  }

  .brand-bg {
    background: var(--brand-bg);
  }

  .brand-primary-bg {
    background-color: var(--brand-primary) !important;
  }

  .brand-primary-text {
    color: var(--brand-primary) !important;
  }

  .brand-accent-text {
    color: var(--brand-accent) !important;
  }

  .brand-secondary-bg {
    background-color: var(--brand-secondary) !important;
  }

  .brand-border {
    border-color: var(--brand-light) !important;
  }
</style>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            lavender: '#b5a7cb',
            peach: '#f8dcc0',
            lavLight: '#e8e2f0',
            peachLight: '#fdf0e4',
            lavDark: '#8a7aa6'

</head>
<body class="min-h-screen bg-white brand-bg">
  <main class="min-h-screen p-4 sm:p-6">
    <div class="max-w-6xl mx-auto">
      <section class="bg-white/90 backdrop-blur rounded-3xl shadow-lg border border-lavLight p-6 sm:p-8 mb-6">
        <div class="text-center">
          <img
  id="brandLogo"
  src=""

/>
          <h1 id="pageTitle" class="font-heading text-4xl text-lavDark font-bold">Mis Rifas</h1>
          <p id="pageSubtitle" class="text-sm text-lavDark/60 mt-2">Crea, administra y comparte tus rifas</p>
          <div id="userBox" class="mt-4 inline-flex items-center gap-2 rounded-full bg-peachLight px-4 py-2 text-sm text-lavDark hidden"></div>
        </div>

        <div id="createSection" class="grid grid-cols-1 md:grid-cols-[1fr_auto] gap-3 mt-6">

            <input

              placeholder="Slug opcional: rifa-dia-madre"

                    placeholder="+56 9 1234 5678"

                    <input

                  <div class="flex gap-2 items-center">
                    <input 
                      id="colorSecondary" 
                      type="color"

                      class="w-12 h-10 rounded-lg border border-lavLight cursor-pointer"
                    />
                    <input 
                      id="colorSecondaryText" 
                      type="text" 
                      value="#f8dcc0"

                <div>

                  <div class="flex gap-2 items-center">
                    <input 
                      id="colorAccent"

                      value="#8a7aa6"

                      value="#8a7aa6"

            <!-- Botones de Acción -->

              <button

                💾 Guardar Cambios

                <div class="w-8 h-8 rounded-full" style="background-color: #f8dcc0"></div>

  <script src="firebase-config.js"></script>
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js';
    import { getAuth, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js';
    import {
      getFirestore,
      collection,
      doc,
      setDoc,
      onSnapshot,
      serverTimestamp,
      getDoc,
      getDocs,
      deleteDoc,
      writeBatch,
      query,
      where
    } from 'https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js';
    import { getStorage, ref, uploadBytes, getDownloadURL } from 'https://www.gstatic.com/firebasejs/12.0.0/firebase-storage.js';

    const defaultConfig = {
      raffle_name: 'Gran Rifa',
      prize: 'Una canasta sorpresa',
      price: '2000',
      whatsapp: '56933024232',
      reserve_message: 'Hola, quiero reservar un número de la rifa y realizar el pago.',
      payment_message: 'Para confirmar tu número, realiza el pago y envía el comprobante. Transferencia a: [TUS DATOS AQUÍ]',
      total_numbers: '100'
    };

    let app, auth, db, storage;
    let currentUser = null;
    let currentProfile = null;
    let unsubscribeOwnRaffles = null;
    let allUsersCache = [];

    function showStatus(message, isError = false) {
      const box = document.getElementById('statusBox');
      box.textContent = message;
      box.classList.remove('hidden');
      box.className = 'mt-4 text-sm rounded-2xl px-4 py-3 ' + (
        isError ? 'bg-red-50 text-red-600' : 'bg-peachLight text-lavDark/80'
      );
    }

    function clearStatus() {
      const box = document.getElementById('statusBox');
      box.classList.add('hidden');
      box.textContent = '';
    }

    function slugify(text) {
      return String(text || '')
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '')
        .replace(/-{2,}/g, '-')
        .slice(0, 50);
    }

    function generateShareId() {
      return 'share-' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
    }

    function isSuperAdmin() {
      return currentProfile?.role === 'superadmin';
    }

    function userProfileRef(userId) {
      return doc(db, 'users', userId);
    }

    function rafflesColRef(userId = currentUser.uid) {
      return collection(db, 'users', userId, 'raffles');
    }

    function raffleDocRef(raffleId, userId = currentUser.uid) {
      return doc(db, 'users', userId, 'raffles', raffleId);
    }

    function raffleConfigRef(raffleId, userId = currentUser.uid) {
      return doc(db, 'users', userId, 'raffles', raffleId, 'meta', 'config');
    }

    function raffleTicketsColRef(raffleId, userId = currentUser.uid) {
      return collection(db, 'users', userId, 'raffles', raffleId, 'tickets');
    }

    function publicRaffleRef(shareId) {
      return doc(db, 'public_raffles', shareId);
    }

    function brandingRef() {
      return doc(db, 'school-branding', 'default');
    }

    async function ensureRootRaffleDoc(raffleId, raffleName, shareId, ownerUid = null) {
      const uid = ownerUid || currentUser.uid;
      await setDoc(raffleDocRef(raffleId, uid), {
        raffle_id: raffleId,
        raffle_name: raffleName,
        public_share_id: shareId,
        prize: defaultConfig.prize,
        price: defaultConfig.price,
        total_numbers: defaultConfig.total_numbers,
        created_by_uid: currentUser.uid,
        created_by_email: currentUser.email || '',
        created_by_name: currentProfile?.display_name || currentUser.email || '',
        createdAt: serverTimestamp(),
        updatedAt: serverTimestamp()
      }, { merge: true });
    }

    async function ensurePublicRaffleDoc(shareId, raffleId, raffleName, ownerUid = null) {
      const uid = ownerUid || currentUser.uid;
      await setDoc(publicRaffleRef(shareId), {
        owner_uid: uid,
        raffle_id: raffleId,
        raffle_name: raffleName,
        created_by_uid: currentUser.uid,
        created_by_email: currentUser.email || '',
        created_by_name: currentProfile?.display_name || currentUser.email || '',
        createdAt: serverTimestamp(),
        updatedAt: serverTimestamp()
      }, { merge: true });
    }

    async function ensureRaffleConfig(raffleId, raffleName, ownerUid = null) {
      const uid = ownerUid || currentUser.uid;
      const snap = await getDoc(raffleConfigRef(raffleId, uid));
      if (!snap.exists()) {
        await setDoc(raffleConfigRef(raffleId, uid), {
          ...defaultConfig,
          raffle_name: raffleName || defaultConfig.raffle_name,
          createdAt: serverTimestamp(),
          updatedAt: serverTimestamp()
        }, { merge: true });
      }
    }

    async function createRaffle() {
      clearStatus();

      const nameInput = document.getElementById('raffleNameInput');
      const slugInput = document.getElementById('raffleSlugInput');
      const ownerSelect = document.getElementById('raffleOwnerSelect');

      const raffleName = nameInput.value.trim();
      let raffleId = slugify(slugInput.value.trim());

      if (!raffleName) {
        showStatus('Debes escribir un nombre para la rifa.', true);
        return;
      }

      if (!raffleId) raffleId = slugify(raffleName);

      if (!raffleId) {
        showStatus('No se pudo generar un identificador para la rifa.', true);
        return;
      }

      let targetUserId = null;
      if (isSuperAdmin()) {
        targetUserId = ownerSelect.value;
        if (!targetUserId) {
          showStatus('Debes seleccionar un usuario para crear la rifa.', true);
          return;
        }
      }

      try {
        const shareId = generateShareId();

        await ensureRootRaffleDoc(raffleId, raffleName, shareId, targetUserId);
        await ensurePublicRaffleDoc(shareId, raffleId, raffleName, targetUserId);
        await ensureRaffleConfig(raffleId, raffleName, targetUserId);

        nameInput.value = '';
        slugInput.value = '';
        if (ownerSelect) ownerSelect.value = '';

        showStatus('Rifa creada correctamente.');
        await refreshDashboard();
      } catch (error) {
        console.error(error);
        showStatus('Error al crear la rifa.', true);
      }
    }

    async function deleteRaffle(ownerUid, raffleId, raffleName, shareId) {
      const ok = window.confirm(`¿Seguro que quieres borrar la rifa "${raffleName}"? Esta acción eliminará tickets, configuración y la rifa del panel.`);
      if (!ok) return;

      try {
        const ticketsSnap = await getDocs(raffleTicketsColRef(raffleId, ownerUid));

        if (!ticketsSnap.empty) {
          const docs = ticketsSnap.docs;
          for (let i = 0; i < docs.length; i += 400) {
            const batch = writeBatch(db);
            docs.slice(i, i + 400).forEach((d) => batch.delete(d.ref));
            await batch.commit();
          }
        }

        await deleteDoc(raffleConfigRef(raffleId, ownerUid));
        await deleteDoc(raffleDocRef(raffleId, ownerUid));

        if (shareId) {
          await deleteDoc(publicRaffleRef(shareId));
        }

        showStatus(`Rifa "${raffleName}" eliminada correctamente.`);
        await refreshDashboard();
      } catch (error) {
        console.error(error);
        showStatus('Error al eliminar la rifa.', true);
      }
    }

    async function loadAllUsers() {
      try {
        const usersSnap = await getDocs(collection(db, 'users'));
        allUsersCache = usersSnap.docs.map(doc => ({
          id: doc.id,
          email: doc.data().email || '',
          display_name: doc.data().display_name || '',
          role: doc.data().role || 'user'
        }));

        // Actualizar dropdown de superadmin
        const select = document.getElementById('raffleOwnerSelect');
        if (select) {
          const regularUsers = allUsersCache.filter(u => u.role !== 'superadmin');
          select.innerHTML = '<option value="">Seleccionar usuario...</option>';
          regularUsers.forEach(user => {
            const option = document.createElement('option');
            option.value = user.id;
            option.textContent = `${user.display_name || user.email} (${user.email})`;
            select.appendChild(option);
          });
        }

        // Actualizar sección de usuarios
        renderUsersList();
      } catch (error) {
        console.error('Error cargando usuarios:', error);
      }
    }

    function renderUsersList() {
      const usersList = document.getElementById('usersList');
      const usersCountBox = document.getElementById('usersCountBox');

      if (allUsersCache.length === 0) {
        usersList.innerHTML = '<p class="text-lavDark/50">No hay usuarios para mostrar.</p>';
        usersCountBox.textContent = '0 usuarios';
        return;
      }

      usersCountBox.textContent = `${allUsersCache.length} usuarios`;

      usersList.innerHTML = allUsersCache.map(user => `
        <div class="bg-lavLight/10 rounded-2xl p-4 border border-lavLight/30">
          <div class="flex items-center justify-between">
            <div>
              <p class="font-semibold text-lavDark">${user.display_name || user.email}</p>
              <p class="text-xs text-lavDark/60">${user.email}</p>
              <p class="text-xs mt-1">
                <span class="inline-block px-2 py-1 rounded-full ${user.role === 'superadmin' ? 'bg-red-100 text-red-700' : 'bg-blue-100 text-blue-700'}">
                  ${user.role}
                </span>
              </p>
            </div>
          </div>
        </div>
      `).join('');
    }

    function loadBrandingToForm() {
      onSnapshot(brandingRef(), (snap) => {
        const data = snap.data() || {};
        document.getElementById('schoolName').value = data.school_name || '';
        document.getElementById('schoolWebsite').value = data.school_website || '';
        document.getElementById('schoolEmail').value = data.school_email || '';
        document.getElementById('schoolPhone').value = data.school_phone || '';
        document.getElementById('colorPrimary').value = data.primary_color || '#b5a7cb';
        document.getElementById('colorPrimaryText').value = data.primary_color || '#b5a7cb';
        document.getElementById('colorSecondary').value = data.secondary_color || '#f8dcc0';
        document.getElementById('colorSecondaryText').value = data.secondary_color || '#f8dcc0';
        document.getElementById('colorAccent').value = data.accent_color || '#8a7aa6';
        document.getElementById('colorAccentText').value = data.accent_color || '#8a7aa6';
        
        if (data.logo_url) {
          document.getElementById('logoPreview').src = data.logo_url;
          document.getElementById('logoPreview').classList.remove('hidden');
        }

        updateBrandingPreview();
      });
    }

    function updateBrandingPreview() {
      const schoolName = document.getElementById('schoolName').value || 'Mi Colegio';
      const schoolWebsite = document.getElementById('schoolWebsite').value;
      const schoolEmail = document.getElementById('schoolEmail').value;
      const schoolPhone = document.getElementById('schoolPhone').value;
      const primary = document.getElementById('colorPrimary').value;
      const secondary = document.getElementById('colorSecondary').value;
      const accent = document.getElementById('colorAccent').value;

      document.getElementById('previewSchoolName').textContent = schoolName;
      
      const infoDiv = document.getElementById('previewSchoolInfo');
      infoDiv.innerHTML = '';
      if (schoolWebsite) infoDiv.innerHTML += `<div>🌐 ${schoolWebsite}</div>`;
      if (schoolEmail) infoDiv.innerHTML += `<div>📧 ${schoolEmail}</div>`;
      if (schoolPhone) infoDiv.innerHTML += `<div>📱 ${schoolPhone}</div>`;

      const preview = document.getElementById('brandingPreview');
      preview.style.background = `linear-gradient(135deg, ${secondary}80 0%, #ffffff 40%, ${primary}60 100%)`;

      document.querySelectorAll('.preview-color-1').forEach(el => el.style.backgroundColor = primary);
      document.querySelectorAll('.preview-color-2').forEach(el => el.style.backgroundColor = secondary);
      document.querySelectorAll('.preview-color-3').forEach(el => el.style.backgroundColor = accent);

      preview.querySelectorAll('.w-8')[0].style.backgroundColor = primary;
      preview.querySelectorAll('.w-8')[1].style.backgroundColor = secondary;
      preview.querySelectorAll('.w-8')[2].style.backgroundColor = accent;
    }

    async function saveBranding() {
      const schoolName = document.getElementById('schoolName').value.trim();
      const schoolWebsite = document.getElementById('schoolWebsite').value.trim();
      const schoolEmail = document.getElementById('schoolEmail').value.trim();
      const schoolPhone = document.getElementById('schoolPhone').value.trim();
      const primary = document.getElementById('colorPrimary').value;
      const secondary = document.getElementById('colorSecondary').value;
      const accent = document.getElementById('colorAccent').value;

      const brandingData = {
        school_name: schoolName,
        school_website: schoolWebsite,
        school_email: schoolEmail,
        school_phone: schoolPhone,
        primary_color: primary,
        secondary_color: secondary,
        accent_color: accent,
        updatedAt: serverTimestamp()
      };

      await setDoc(brandingRef(), brandingData, { merge: true });
      showStatus('✅ Datos guardados correctamente');
      updateBrandingPreview();
    }
    window.saveBranding = saveBranding;

    function resetBranding() {
      document.getElementById('schoolName').value = '';
      document.getElementById('schoolWebsite').value = '';
      document.getElementById('schoolEmail').value = '';
      document.getElementById('schoolPhone').value = '';
      document.getElementById('colorPrimary').value = '#b5a7cb';
      document.getElementById('colorPrimaryText').value = '#b5a7cb';
      document.getElementById('colorSecondary').value = '#f8dcc0';
      document.getElementById('colorSecondaryText').value = '#f8dcc0';
      document.getElementById('colorAccent').value = '#8a7aa6';
      document.getElementById('colorAccentText').value = '#8a7aa6';
      updateBrandingPreview();
    }
    window.resetBranding = resetBranding;

    // Event listeners para sincronizar colores
    document.getElementById('colorPrimary').addEventListener('change', (e) => {
      document.getElementById('colorPrimaryText').value = e.target.value;
      updateBrandingPreview();
    });
    document.getElementById('colorPrimaryText').addEventListener('change', (e) => {
      document.getElementById('colorPrimary').value = e.target.value;
      updateBrandingPreview();
    });

    document.getElementById('colorSecondary').addEventListener('change', (e) => {
      document.getElementById('colorSecondaryText').value = e.target.value;
      updateBrandingPreview();
    });
    document.getElementById('colorSecondaryText').addEventListener('change', (e) => {
      document.getElementById('colorSecondary').value = e.target.value;
      updateBrandingPreview();
    });

    document.getElementById('colorAccent').addEventListener('change', (e) => {
      document.getElementById('colorAccentText').value = e.target.value;
      updateBrandingPreview();
    });
    document.getElementById('colorAccentText').addEventListener('change', (e) => {
      document.getElementById('colorAccent').value = e.target.value;
      updateBrandingPreview();
    });

    document.getElementById('schoolName').addEventListener('input', updateBrandingPreview);
    document.getElementById('schoolWebsite').addEventListener('input', updateBrandingPreview);
    document.getElementById('schoolEmail').addEventListener('input', updateBrandingPreview);
    document.getElementById('schoolPhone').addEventListener('input', updateBrandingPreview);

      // Refrescar tabla de rifas
    }

    async function init() {
      app = initializeApp(window.FIREBASE_CONFIG);
      auth = getAuth(app);
      db = getFirestore(app);
      storage = getStorage(app);

      document.getElementById('createRaffleBtn').addEventListener('click', createRaffle);
      document.getElementById('logoutBtn').addEventListener('click', async () => {
        await signOut(auth);
        window.location.href = 'login.html';
      });

      onAuthStateChanged(auth, async (user) => {
        if (!user) {
          window.location.href = 'login.html';
          return;
        }

        currentUser = user;
        const profileSnap = await getDoc(userProfileRef(user.uid));
        currentProfile = profileSnap.data() || {};

        document.getElementById('userBox').classList.remove('hidden');
        document.getElementById('userBox').textContent = user.email;

        // Mostrar sección de branding
        document.getElementById('brandingSection').classList.remove('hidden');
        loadBrandingToForm();

        // Si es superadmin, mostrar sección de usuarios
        if (isSuperAdmin()) {
          document.getElementById('usersSection').classList.remove('hidden');
          document.getElementById('ownerSelectContainer').classList.remove('hidden');
          await loadAllUsers();
        }
      });
    }

    init().catch(err => {
      console.error(err);
      alert('Error iniciando app');
    });
  </script>
