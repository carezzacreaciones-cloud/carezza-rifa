<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro | Carezza Rifa</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Nunito:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Nunito', sans-serif; }
    .font-heading { font-family: 'Cormorant Garamond', serif; }
  </style>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            lavender: '#b5a7cb',
            peach: '#f8dcc0',
            lavLight: '#e8e2f0',
            peachLight: '#fdf0e4',
            lavDark: '#8a7aa6'
          }
        }
      }
    }
  </script>
</head>
<body class="min-h-screen bg-white" style="background: linear-gradient(135deg, #fdf0e4 0%, #ffffff 40%, #e8e2f0 100%);">
  <main class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white/90 backdrop-blur rounded-3xl shadow-xl border border-lavLight p-8">
      <div class="text-center mb-8">
        <h1 class="font-heading text-4xl text-lavDark font-bold">Crear cuenta</h1>
        <p class="text-lavDark/60 mt-2">Regístrate para usar tu panel de rifas</p>
      </div>

      <form id="registerForm" class="space-y-4">
        <div>
          <div>
  <label class="block text-sm font-semibold text-lavDark/70 mb-1">Nombre</label>
  <input
    id="displayName"
    type="text"
    required
    class="w-full px-4 py-3 rounded-2xl border border-lavLight focus:outline-none focus:ring-2 focus:ring-lavender/40"
    placeholder="Ej: María Pérez"
  />
</div>
          <label class="block text-sm font-semibold text-lavDark/70 mb-1">Correo electrónico</label>
          <input
            id="email"
            type="email"
            required
            class="w-full px-4 py-3 rounded-2xl border border-lavLight focus:outline-none focus:ring-2 focus:ring-lavender/40"
            placeholder="tucorreo@email.com"
          />
        </div>

        <div>
          <label class="block text-sm font-semibold text-lavDark/70 mb-1">Contraseña</label>
          <input
            id="password"
            type="password"
            required
            class="w-full px-4 py-3 rounded-2xl border border-lavLight focus:outline-none focus:ring-2 focus:ring-lavender/40"
            placeholder="********"
          />
        </div>

        <div>
          <label class="block text-sm font-semibold text-lavDark/70 mb-1">Confirmar contraseña</label>
          <input
            id="confirmPassword"
            type="password"
            required
            class="w-full px-4 py-3 rounded-2xl border border-lavLight focus:outline-none focus:ring-2 focus:ring-lavender/40"
            placeholder="********"
          />
        </div>

        <button
          type="submit"
          id="registerBtn"
          class="w-full py-3 rounded-2xl bg-lavender text-white font-semibold hover:bg-lavDark transition"
        >
          Crear cuenta
        </button>
      </form>

      <p id="message" class="mt-4 text-sm text-center"></p>

      <div class="mt-6 text-center">
        <p class="text-sm text-lavDark/70">
          ¿Ya tienes cuenta?
          <a href="login.html" class="text-lavDark font-semibold underline">Inicia sesión</a>
        </p>
      </div>
    </div>
  </main>

  <script src="firebase-config.js"></script>
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js';
    import { getAuth, createUserWithEmailAndPassword, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js';
    import { getFirestore, doc, setDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js';
    if (!window.FIREBASE_CONFIG) {
      alert('Falta firebase-config.js');
      throw new Error('Falta firebase-config.js');
    }

    const app = initializeApp(window.FIREBASE_CONFIG);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const form = document.getElementById('registerForm');
    const msg = document.getElementById('message');
    const btn = document.getElementById('registerBtn');

    onAuthStateChanged(auth, (user) => {
      if (user) {
        window.location.href = 'dashboard.html';
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.textContent = '';
      msg.className = 'mt-4 text-sm text-center';

      const displayName = document.getElementById('displayName').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (!displayName) {
  msg.textContent = 'Debes ingresar un nombre.';
  msg.classList.add('text-red-600');
  return;
}
      if (password !== confirmPassword) {
        msg.textContent = 'Las contraseñas no coinciden.';
        msg.classList.add('text-red-600');
        return;
      }

      if (password.length < 6) {
        msg.textContent = 'La contraseña debe tener al menos 6 caracteres.';
        msg.classList.add('text-red-600');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Creando cuenta...';

      try {
       const cred = await createUserWithEmailAndPassword(auth, email, password);

await setDoc(doc(db, 'users', cred.user.uid), {
  email,
  display_name: displayName,
  role: 'admin',
  active: true,
  createdAt: serverTimestamp()
}, { merge: true });

window.location.href = 'dashboard.html';
      } catch (error) {
        console.error(error);
        msg.textContent = 'No se pudo crear la cuenta. Verifica que el correo no esté en uso.';
        msg.classList.add('text-red-600');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Crear cuenta';
      }
    });
  </script>
</body>
</html>
