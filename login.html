<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión | Carezza Rifa</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Nunito:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Nunito', sans-serif; }
    .font-heading { font-family: 'Cormorant Garamond', serif; }
  </style>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            lavender: '#b5a7cb',
            peach: '#f8dcc0',
            lavLight: '#e8e2f0',
            peachLight: '#fdf0e4',
            lavDark: '#8a7aa6'
          }
        }
      }
    }
  </script>
</head>
<body class="min-h-screen bg-white" style="background: linear-gradient(135deg, #fdf0e4 0%, #ffffff 40%, #e8e2f0 100%);">
  <main class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white/90 backdrop-blur rounded-3xl shadow-xl border border-lavLight p-8">
      <div class="text-center mb-8">
        <h1 class="font-heading text-4xl text-lavDark font-bold">Iniciar sesión</h1>
        <p class="text-lavDark/60 mt-2">Accede a tu panel de rifas</p>
      </div>

      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-sm font-semibold text-lavDark/70 mb-1">Correo electrónico</label>
          <input
            id="email"
            type="email"
            required
            class="w-full px-4 py-3 rounded-2xl border border-lavLight focus:outline-none focus:ring-2 focus:ring-lavender/40"
            placeholder="tucorreo@email.com"
          />
        </div>

        <div>
          <label class="block text-sm font-semibold text-lavDark/70 mb-1">Contraseña</label>
          <input
            id="password"
            type="password"
            required
            class="w-full px-4 py-3 rounded-2xl border border-lavLight focus:outline-none focus:ring-2 focus:ring-lavender/40"
            placeholder="********"
          />
        </div>

        <button
          type="submit"
          id="loginBtn"
          class="w-full py-3 rounded-2xl bg-lavender text-white font-semibold hover:bg-lavDark transition"
        >
          Iniciar sesión
        </button>
      </form>

      <p id="message" class="mt-4 text-sm text-center"></p>

      <div class="mt-6 text-center">
        <p class="text-sm text-lavDark/70">
          ¿No tienes cuenta?
          <a href="register.html" class="text-lavDark font-semibold underline">Regístrate</a>
        </p>
      </div>
    </div>
  </main>

  <script src="firebase-config.js"></script>
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js';
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js';

    if (!window.FIREBASE_CONFIG) {
      alert('Falta firebase-config.js');
      throw new Error('Falta firebase-config.js');
    }

    const app = initializeApp(window.FIREBASE_CONFIG);
    const auth = getAuth(app);

    const form = document.getElementById('loginForm');
    const msg = document.getElementById('message');
    const btn = document.getElementById('loginBtn');

    onAuthStateChanged(auth, (user) => {
      if (user) {
        window.location.href = 'dashboard.html';
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.textContent = '';
      msg.className = 'mt-4 text-sm text-center';
      btn.disabled = true;
      btn.textContent = 'Ingresando...';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        await signInWithEmailAndPassword(auth, email, password);
        window.location.href = 'dashboard.html';
      } catch (error) {
        console.error(error);
        msg.textContent = 'No se pudo iniciar sesión. Verifica tu correo y contraseña.';
        msg.classList.add('text-red-600');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Iniciar sesión';
      }
    });
  </script>
</body>
</html>
