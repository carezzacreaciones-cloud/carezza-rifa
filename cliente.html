<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rifa - Reserva tu Número</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Nunito:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Nunito', sans-serif; }
    .font-heading { font-family: 'Cormorant Garamond', serif; }
    .ticket-cell { transition: all 0.2s ease; }
    .ticket-cell:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(181,167,203,0.3); }
    .toast-msg {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      transition: opacity 0.3s;
      pointer-events: none;
    }
    .fade-in { animation: fadeIn 0.35s ease; }
    @keyframes fadeIn {
      from { opacity:0; transform: translateY(8px); }
      to { opacity:1; transform: translateY(0);}
    }
  </style>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            lavender: '#b5a7cb',
            peach: '#f8dcc0',
            lavLight: '#e8e2f0',
            peachLight: '#fdf0e4',
            lavDark: '#8a7aa6'
          }
        }
      }
    }
  </script>
</head>
<body class="min-h-screen bg-white" style="background: linear-gradient(135deg, #fdf0e4 0%, #ffffff 40%, #e8e2f0 100%);">
  <div id="toast" class="toast-msg opacity-0 bg-lavender text-white"></div>

  <main class="min-h-screen p-4 sm:p-6 pb-28">
    <div class="max-w-5xl mx-auto">
      <header class="text-center py-6 fade-in">
        <h1 id="headerTitle" class="font-heading text-4xl sm:text-5xl text-lavDark font-bold">Gran Rifa</h1>
        <p class="text-sm text-lavDark/60 mt-2">Elige uno o varios números y resérvalos por WhatsApp</p>
        
        <!-- Información del establecimiento -->
        <div id="schoolInfo" class="mt-4 inline-block rounded-2xl bg-white/90 border border-lavLight shadow-sm p-4 hidden">
          <p id="schoolNameDisplay" class="font-heading text-lg text-lavDark font-bold"></p>
          <div id="schoolContactDisplay" class="text-xs text-lavDark/60 mt-2 space-y-1"></div>
        </div>
      </header>

      <div
        id="raffleClosedNotice"
        class="hidden max-w-5xl mx-auto px-4 mt-4"
      >
        <div class="bg-amber-50 border border-amber-200 text-amber-800 rounded-3xl p-4 text-sm font-semibold">
          <p id="raffleClosedNoticeText">
            Esta rifa no está disponible para nuevas reservas.
          </p>
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6 fade-in">
        <div class="bg-white/90 rounded-2xl border border-lavLight shadow-sm p-4 text-center">
          <p class="text-xs uppercase tracking-wide text-lavDark/60 font-semibold">Premio</p>
          <p id="infoPrize" class="font-heading text-2xl text-lavDark font-bold mt-1">Una canasta sorpresa</p>
        </div>

        <div class="bg-white/90 rounded-2xl border border-lavLight shadow-sm p-4 text-center">
          <p class="text-xs uppercase tracking-wide text-lavDark/60 font-semibold">Precio</p>
          <p id="infoPrice" class="font-heading text-2xl text-lavDark font-bold mt-1">$2.000</p>
        </div>

        <div class="bg-white/90 rounded-2xl border border-lavLight shadow-sm p-4 text-center">
          <p class="text-xs uppercase tracking-wide text-lavDark/60 font-semibold">Disponibles</p>
          <p id="infoAvailable" class="font-heading text-2xl text-emerald-600 font-bold mt-1">0</p>
        </div>
      </div>

      <section class="bg-white/90 rounded-2xl border border-lavLight shadow-sm p-4 sm:p-5 fade-in">
        <div class="flex gap-2 mb-4 flex-wrap">
          <button onclick="setFilter('all')" id="filterAll" class="px-3 py-1 rounded-full text-xs font-semibold border transition-colors bg-lavender text-white border-lavender">Todos</button>
          <button onclick="setFilter('available')" id="filterAvail" class="px-3 py-1 rounded-full text-xs font-semibold border transition-colors border-lavLight text-lavDark/60 hover:bg-lavLight/30">Disponibles</button>
          <button onclick="setFilter('reserved')" id="filterReserved" class="px-3 py-1 rounded-full text-xs font-semibold border transition-colors border-lavLight text-lavDark/60 hover:bg-lavLight/30">Reservados</button>
          <button onclick="setFilter('paid')" id="filterPaid" class="px-3 py-1 rounded-full text-xs font-semibold border transition-colors border-lavLight text-lavDark/60 hover:bg-lavLight/30">Pagados</button>
        </div>

        <p class="text-sm text-lavDark/60 mb-4">
          Toca los números verdes para seleccionarlos.
        </p>

        <div id="ticketGrid" class="grid gap-2" style="grid-template-columns: repeat(auto-fill, minmax(64px, 1fr));"></div>
      </section>
    </div>
  </main>

  <div id="bulkReserveBar" class="hidden fixed bottom-4 left-1/2 -translate-x-1/2 z-50 w-[calc(100%-2rem)] max-w-xl bg-white border border-lavLight shadow-lg rounded-2xl px-4 py-3">
    <div class="flex flex-col sm:flex-row items-center gap-3 justify-between">
      <div class="text-center sm:text-left">
        <p id="selectedCountText" class="text-sm font-semibold text-lavDark">0 números seleccionados</p>
        <p id="selectedTotalText" class="text-xs text-lavDark/60">$0 total</p>
      </div>
      <div class="flex items-center gap-2 w-full sm:w-auto">
        <button onclick="clearSelection()" class="flex-1 sm:flex-none px-4 py-2 rounded-xl bg-gray-100 text-gray-600 font-semibold hover:bg-gray-200 transition">
          Limpiar
        </button>
        <button onclick="openBulkReserveModal()" class="flex-1 sm:flex-none px-4 py-2 rounded-xl bg-green-500 text-white font-semibold hover:bg-green-600 transition">
          Reservar vía WhatsApp
        </button>
      </div>
    </div>
  </div>

  <div id="modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4" style="background:rgba(0,0,0,0.3);backdrop-filter:blur(4px);">
    <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-xl fade-in">
      <h3 id="modalTitle" class="font-heading text-2xl text-lavDark font-bold mb-4">Reservar números</h3>
      <div id="modalContent"></div>
    </div>
  </div>

  <script src="firebase-config.js"></script>
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js';
    import {
      getFirestore,
      collection,
      doc,
      setDoc,
      getDoc,
      onSnapshot,
      serverTimestamp
    } from 'https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js';

    let app, db;
    let ownerUid = null;
    let currentFilter = 'all';
    let currentRaffleId = null;
    let currentShareId = null;
    let currentRaffleStatus = 'active';
    let selectedNumbers = new Set();

    const raffleClosedNotice = document.getElementById('raffleClosedNotice');
    const raffleClosedNoticeText = document.getElementById('raffleClosedNoticeText');

    const state = {
      config: {
        raffle_name: 'Gran Rifa',
        prize: 'Una canasta sorpresa',
        price: '2000',
        whatsapp: '56933024232',
        reserve_message: 'Hola, quiero reservar un número de la rifa y realizar el pago.',
        payment_message: 'Para confirmar tu número, realiza el pago y envía el comprobante.',
        number_start: '1',
        number_end: '100',
        total_numbers: '100'
      },
      tickets: new Map(),
      branding: {}
    };

    function isRaffleReservable() {
      return currentRaffleStatus === 'active';
    }

    function getRaffleStatusMessage(status) {
      const statusMap = {
        active: '',
        paused: 'Esta rifa está pausada temporalmente. Por ahora no se pueden hacer nuevas reservas.',
        closed: 'Esta rifa ya está cerrada. No se pueden hacer nuevas reservas.',
        drawn: 'Esta rifa ya fue sorteada. No se pueden hacer nuevas reservas.'
      };

      return statusMap[status] || 'Esta rifa no está disponible para nuevas reservas.';
    }

    function showToast(msg, color = '#b5a7cb') {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.background = color;
      t.style.opacity = '1';
      setTimeout(() => t.style.opacity = '0', 2200);
    }

    function ensureFirebaseConfig() {
      if (!window.FIREBASE_CONFIG) {
        alert('Falta firebase-config.js');
        throw new Error('Falta firebase-config.js');
      }
    }

    function getShareIdFromUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get('share');
    }

    function getOwnerUidFromUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get('owner');
    }

    function getRaffleIdFromUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get('raffle');
    }

    function cfg(key) { return state.config[key]; }
    function parseLimitedNumber(value, fallback = 0) {
      const parsed = parseInt(value, 10);
      return Number.isInteger(parsed) ? Math.max(0, Math.min(9999, parsed)) : fallback;
    }

    function numberStart() {
      return parseLimitedNumber(cfg('number_start'), 1);
    }

    function numberEnd() {
      const start = numberStart();
      const explicitEnd = parseInt(cfg('number_end'), 10);

      if (Number.isInteger(explicitEnd)) {
        return Math.max(start, Math.min(9999, explicitEnd));
      }

      return Math.max(start, start + Math.max(1, parseInt(cfg('total_numbers'), 10) || 100) - 1);
    }

    function totalNums() { return numberEnd() - numberStart() + 1; }
    function raffleNumbers() {
      const numbers = [];
      for (let i = numberStart(); i <= numberEnd(); i++) numbers.push(i);
      return numbers;
    }
    function formatTicketNumber(num) {
      return String(num).padStart(Math.max(2, String(numberEnd()).length), '0');
    }
    function getPrice() { return parseInt(cfg('price')) || 0; }
    function getRecord(num) { return state.tickets.get(String(num)) || null; }
    function getStatus(num) { return getRecord(num)?.status || 'available'; }

    function configRef() {
      return doc(db, 'users', ownerUid, 'raffles', currentRaffleId, 'meta', 'config');
    }

    function ticketsColRef() {
      return collection(db, 'users', ownerUid, 'raffles', currentRaffleId, 'tickets');
    }

    function ticketRef(num) {
      return doc(db, 'users', ownerUid, 'raffles', currentRaffleId, 'tickets', String(num));
    }

    function publicRaffleRef(shareId) {
      return doc(db, 'public_raffles', shareId);
    }

    function applyPublicRaffleData(publicData = {}) {
      ownerUid = publicData.owner_uid || ownerUid;
      currentRaffleId = publicData.raffle_id || currentRaffleId;

      state.config = {
        ...state.config,
        ...Object.fromEntries(
          Object.entries({
            raffle_name: publicData.raffle_name,
            prize: publicData.prize,
            price: publicData.price,
            whatsapp: publicData.whatsapp,
            reserve_message: publicData.reserve_message,
            payment_message: publicData.payment_message,
            number_start: publicData.number_start,
            number_end: publicData.number_end,
            total_numbers: publicData.total_numbers
          }).filter(([_, value]) => value != null && value !== '')
        )
      };
    }

    function hexToRgba(hex, alpha = 1) {
      const cleanHex = String(hex || '').replace('#', '');

      if (!/^[0-9A-Fa-f]{6}$/.test(cleanHex)) {
        return `rgba(181, 167, 203, ${alpha})`;
      }

      const r = parseInt(cleanHex.slice(0, 2), 16);
      const g = parseInt(cleanHex.slice(2, 4), 16);
      const b = parseInt(cleanHex.slice(4, 6), 16);

      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function applyBranding(branding = {}) {
      const primary = branding.primary_color || '#b5a7cb';
      const secondary = branding.secondary_color || '#f8dcc0';
      const accent = branding.accent_color || '#8a7aa6';

      document.documentElement.style.setProperty('--brand-primary', primary);
      document.documentElement.style.setProperty('--brand-secondary', secondary);
      document.documentElement.style.setProperty('--brand-accent', accent);

      document.body.style.background = `linear-gradient(135deg, ${hexToRgba(secondary, 0.45)} 0%, #ffffff 40%, ${hexToRgba(primary, 0.35)} 100%)`;

      document.querySelectorAll('.bg-lavender').forEach((el) => {
        el.style.backgroundColor = primary;
      });

      document.querySelectorAll('.text-lavDark').forEach((el) => {
        el.style.color = accent;
      });

      document.querySelectorAll('.border-lavLight').forEach((el) => {
        el.style.borderColor = hexToRgba(primary, 0.35);
      });

      document.querySelectorAll('.bg-peachLight').forEach((el) => {
        el.style.backgroundColor = hexToRgba(secondary, 0.45);
      });

      // Mostrar datos del establecimiento
      const schoolInfo = document.getElementById('schoolInfo');
      if (branding.school_name) {
        schoolInfo.classList.remove('hidden');
        document.getElementById('schoolNameDisplay').textContent = branding.school_name;
        
        const contactDisplay = document.getElementById('schoolContactDisplay');
        contactDisplay.innerHTML = '';
        
        if (branding.school_website) {
          const websiteEl = document.createElement('div');
          websiteEl.innerHTML = `🌐 <a href="${branding.school_website}" target="_blank" class="underline">${branding.school_website}</a>`;
          contactDisplay.appendChild(websiteEl);
        }
        
        if (branding.school_email) {
          const emailEl = document.createElement('div');
          emailEl.innerHTML = `📧 <a href="mailto:${branding.school_email}" class="underline">${branding.school_email}</a>`;
          contactDisplay.appendChild(emailEl);
        }
        
        if (branding.school_phone) {
          const phoneEl = document.createElement('div');
          phoneEl.innerHTML = `📱 <a href="tel:${branding.school_phone}" class="underline">${branding.school_phone}</a>`;
          contactDisplay.appendChild(phoneEl);
        }
      }
    }

    function listenBranding() {
      onSnapshot(doc(db, 'school-branding', 'default'), (snap) => {
        const branding = snap.exists() ? snap.data() : {};
        state.branding = branding;
        applyBranding(branding);
      }, (error) => {
        console.error('Error al cargar branding:', error);
        applyBranding({});
      });
    }

    function renderAll() {
      document.getElementById('headerTitle').textContent = cfg('raffle_name');
      document.getElementById('infoPrize').textContent = cfg('prize');
      document.getElementById('infoPrice').textContent = '$' + getPrice().toLocaleString('es-CL');

      let available = 0;
      raffleNumbers().forEach((i) => {
        if (getStatus(i) === 'available') available++;
      });
      document.getElementById('infoAvailable').textContent = available;

      cleanUnavailableSelections();
      renderGrid();
      updateBulkReserveBar();
    }

    function cleanUnavailableSelections() {
      selectedNumbers.forEach((num) => {
        if (getStatus(num) !== 'available') {
          selectedNumbers.delete(num);
        }
      });
    }

    function renderGrid() {
      const grid = document.getElementById('ticketGrid');
      grid.innerHTML = '';

      raffleNumbers().forEach((i) => {
        const status = getStatus(i);
        const visible = currentFilter === 'all' || currentFilter === status || (currentFilter === 'available' && status === 'available');
        if (!visible) return;

        let bg, text, border, cursor;

        if (status === 'paid') {
          bg = '#ede9fe';
          text = '#7c3aed';
          border = '#c4b5fd';
          cursor = 'not-allowed';
        } else if (status === 'reserved') {
          bg = '#fef3c7';
          text = '#d97706';
          border = '#fcd34d';
          cursor = 'not-allowed';
        } else {
          const isSelected = selectedNumbers.has(i);
          bg = isSelected ? '#b5a7cb' : '#ecfdf5';
          text = isSelected ? '#ffffff' : '#059669';
          border = isSelected ? '#8a7aa6' : '#a7f3d0';
          cursor = 'pointer';
        }

        const el = document.createElement('div');
        el.className = 'ticket-cell';
        el.style.cssText = `
          background:${bg};
          color:${text};
          border:1.5px solid ${border};
          border-radius:12px;
          padding:8px 2px;
          text-align:center;
          font-weight:700;
          font-size:14px;
          cursor:${cursor};
          position:relative;
        `;
        el.textContent = formatTicketNumber(i);

        if (status === 'available') {
          el.addEventListener('click', () => toggleNumberSelection(i));
        }

        grid.appendChild(el);
      });
    }

    function toggleNumberSelection(num) {
      if (getStatus(num) !== 'available') return;

      if (selectedNumbers.has(num)) {
        selectedNumbers.delete(num);
      } else {
        selectedNumbers.add(num);
      }

      renderGrid();
      updateBulkReserveBar();
    }

    function updateBulkReserveBar() {
      const bar = document.getElementById('bulkReserveBar');
      const countText = document.getElementById('selectedCountText');
      const totalText = document.getElementById('selectedTotalText');
      const count = selectedNumbers.size;
      const total = count * getPrice();

      if (count === 0) {
        bar.classList.add('hidden');
        return;
      }

      countText.textContent = `${count} ${count === 1 ? 'número seleccionado' : 'números seleccionados'}`;
      totalText.textContent = `$${total.toLocaleString('es-CL')} total`;
      bar.classList.remove('hidden');
    }

    function clearSelection() {
      selectedNumbers.clear();
      renderGrid();
      updateBulkReserveBar();
    }
    window.clearSelection = clearSelection;

    function setFilter(f) {
      currentFilter = f;
      ['All','Avail','Reserved','Paid'].forEach(k => {
        const btn = document.getElementById('filter' + k);
        const active = f === k.toLowerCase() || (f === 'all' && k === 'All') || (f === 'available' && k === 'Avail');
        btn.className = `px-3 py-1 rounded-full text-xs font-semibold border transition-colors ${active ? 'bg-lavender text-white border-lavender' : 'border-lavLight text-lavDark/60 hover:bg-lavLight/30'}`;
      });
      renderGrid();
    }
    window.setFilter = setFilter;

    function openBulkReserveModal() {
      const numbers = [...selectedNumbers].sort((a, b) => a - b);
      if (!numbers.length) {
        showToast('Selecciona al menos un número', '#e57373');
        return;
      }

      const formattedNumbers = numbers.map(n => `#${formatTicketNumber(n)}`).join(', ');
      const total = numbers.length * getPrice();

      document.getElementById('modalTitle').textContent = 'Reservar números';
      document.getElementById('modalContent').innerHTML = `
        <div class="space-y-3">
          <div class="rounded-xl bg-peachLight px-3 py-3">
            <p class="text-xs font-semibold uppercase text-lavDark/60">Seleccionados</p>
            <p class="text-sm font-semibold text-lavDark mt-1">${formattedNumbers}</p>
            <p class="text-xs text-lavDark/70 mt-1">Cantidad: ${numbers.length} · Total: $${total.toLocaleString('es-CL')}</p>
          </div>

          <div>
            <label class="text-xs font-semibold text-lavDark/60 uppercase">Nombre</label>
            <input id="mName" class="w-full mt-1 px-3 py-2 rounded-xl border border-lavLight text-sm focus:outline-none focus:ring-2 focus:ring-lavender/40" />
          </div>

          <div>
            <label class="text-xs font-semibold text-lavDark/60 uppercase">Teléfono</label>
            <input id="mPhone" class="w-full mt-1 px-3 py-2 rounded-xl border border-lavLight text-sm focus:outline-none focus:ring-2 focus:ring-lavender/40" />
          </div>

          <button id="reserveBtn" class="w-full py-2.5 rounded-xl bg-green-500 text-white font-semibold text-sm hover:bg-green-600 transition-colors">
            Reservar vía WhatsApp
          </button>

          <button id="cancelBtn" class="w-full py-2 rounded-xl bg-gray-100 text-gray-500 font-semibold text-sm hover:bg-gray-200 transition-colors">
            Cancelar
          </button>
        </div>
      `;

      document.getElementById('reserveBtn').addEventListener('click', reserveSelectedNumbers);
      document.getElementById('cancelBtn').addEventListener('click', closeModal);
      document.getElementById('modal').style.display = 'flex';
    }
    window.openBulkReserveModal = openBulkReserveModal;

    function closeModal() {
      document.getElementById('modal').style.display = 'none';
    }
    window.closeModal = closeModal;

    document.getElementById('modal').addEventListener('click', (e) => {
      if (e.target === e.currentTarget) closeModal();
    });

    async function reserveSelectedNumbers() {
      const name = document.getElementById('mName')?.value?.trim();
      const phone = document.getElementById('mPhone')?.value?.trim();
      const numbers = [...selectedNumbers].sort((a, b) => a - b);

      if (!numbers.length) {
        showToast('Selecciona al menos un número', '#e57373');
        return;
      }

      if (!name || !phone) {
        showToast('Nombre y teléfono requeridos', '#e57373');
        return;
      }

      for (const num of numbers) {
        const fresh = await getDoc(ticketRef(num));
        if (fresh.exists()) {
          const data = fresh.data();
          if (data.status === 'reserved' || data.status === 'paid') {
            showToast(`El número #${formatTicketNumber(num)} ya no está disponible`, '#e57373');
            selectedNumbers.delete(num);
            renderAll();
            closeModal();
            return;
          }
        }
      }

      for (const num of numbers) {
        await setDoc(ticketRef(num), {
          number: num,
          status: 'reserved',
          name,
          phone,
          note: '',
          reservedAt: serverTimestamp(),
          paidAt: null
        }, { merge: true });
      }

      const wa = String(cfg('whatsapp')).replace(/\D/g, '');
      const formattedNumbers = numbers.map(n => `#${formatTicketNumber(n)}`).join(', ');
      const total = numbers.length * getPrice();

      const fullMsg = `${cfg('reserve_message')}

Números: ${formattedNumbers}
Cantidad: ${numbers.length}
Precio total: $${total.toLocaleString('es-CL')}

Mis datos:
Nombre: ${name}
Teléfono: ${phone}`;

      showToast('Números reservados. Abriendo WhatsApp...', '#059669');
      selectedNumbers.clear();
      closeModal();
      renderAll();

      setTimeout(() => {
        window.open(`https://wa.me/${wa}?text=${encodeURIComponent(fullMsg)}`, '_blank');
      }, 350);
    }

    async function init() {
      ensureFirebaseConfig();

      currentShareId = getShareIdFromUrl();
      ownerUid = getOwnerUidFromUrl();
      currentRaffleId = getRaffleIdFromUrl();

      if (!currentShareId && (!ownerUid || !currentRaffleId)) {
        document.body.innerHTML = `
          <main class="min-h-screen flex items-center justify-center p-4">
            <div class="max-w-md w-full bg-white rounded-3xl border border-lavLight shadow-lg p-6 text-center">
              <h1 class="font-heading text-3xl text-lavDark font-bold mb-3">Enlace incompleto</h1>
              <p class="text-lavDark/70">Faltan datos para cargar la rifa.</p>
            </div>
          </main>
        `;
        return;
      }

      app = initializeApp(window.FIREBASE_CONFIG);
      db = getFirestore(app);

      listenBranding();

      if (currentShareId) {
        try {
          const publicSnap = await getDoc(publicRaffleRef(currentShareId));

          if (publicSnap.exists()) {
            const publicData = publicSnap.data();
            applyPublicRaffleData(publicData);
            renderAll();
          }
        } catch (error) {
          console.warn('No se pudo leer el índice público. Se intentará cargar con owner y raffle.', error);
        }
      }

      if (!ownerUid || !currentRaffleId) {
        document.body.innerHTML = `
          <main class="min-h-screen flex items-center justify-center p-4">
            <div class="max-w-md w-full bg-white rounded-3xl border border-lavLight shadow-lg p-6 text-center">
              <h1 class="font-heading text-3xl text-lavDark font-bold mb-3">Rifa no encontrada</h1>
              <p class="text-lavDark/70">Este enlace no corresponde a una rifa disponible.</p>
            </div>
          </main>
        `;
        return;
      }

      if (currentShareId) {
        onSnapshot(publicRaffleRef(currentShareId), (snap) => {
          if (snap.exists()) {
            applyPublicRaffleData(snap.data());
            renderAll();
          }
        }, (error) => {
          console.warn('No se pudo escuchar el índice público de la rifa.', error);
        });
      }

      onSnapshot(configRef(), (snap) => {
        if (snap.exists()) {
          const data = snap.data();
          state.config = {
            ...state.config,
            ...Object.fromEntries(Object.entries(data).filter(([_, v]) => v != null))
          };
          renderAll();
        }
      }, (error) => {
        console.warn('No se pudo leer la configuración privada. Se usarán los datos públicos.', error);
      });

      onSnapshot(ticketsColRef(), (snapshot) => {
        const next = new Map();
        snapshot.forEach((docSnap) => next.set(docSnap.id, docSnap.data()));
        state.tickets = next;
        renderAll();
      }, (error) => {
        console.warn('No se pudieron leer los tickets de la rifa.', error);
      });

      renderAll();
    }

    init().catch(err => {
      console.error(err);
      alert('Error iniciando cliente. Revisa el share y las reglas de Firestore.');
    });
  </script>
</body>
</html>
